name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    # GitHub-hosted on purpose, against the org CLAUDE.md default: this job is
    # ~45s and only fires on PRs to a tiny package, and the self-hosted pool is
    # Linux-only. Every helper in proc.py branches on sys.platform and the
    # win32 branches are the ones that actually break, so a real Windows leg is
    # worth more here than the saved minutes. Long-running jobs still belong on
    # self-hosted.
    test:
        name: Lint and test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install
              run: python -m pip install --upgrade pip ".[dev,lint]"

            - name: Ruff
              run: ruff check .

            - name: Ruff format
              run: ruff format --check .

            - name: Mypy
              run: mypy sb90_devops

            # test_proc_windows.py drives the win32 branches with a patched
            # sys.platform. Redundant with the windows-latest leg by design —
            # it keeps those branches covered if the matrix ever collapses to
            # self-hosted Linux.
            - name: Pytest
              run: pytest -q
