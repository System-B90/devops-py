name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    # One job with sequential steps, not lint/test/build split: the self-hosted
    # pool is an autoscaled dind fleet on one 8-vCPU box, so splitting does not
    # queue work behind itself — it just multiplies checkouts and installs on a
    # box that is already the bottleneck. See the org CLAUDE.md "Runners" notes.
    test:
        name: Lint and test
        runs-on: self-hosted
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install
              run: python -m pip install --upgrade pip ".[dev,lint]"

            - name: Ruff
              run: ruff check .

            - name: Ruff format
              run: ruff format --check .

            - name: Mypy
              run: mypy sb90_devops

            # The runner pool is Linux-only, so the win32 branches in proc.py
            # can never execute here. tests/test_proc_windows.py drives them
            # with a patched sys.platform instead — that is the only coverage
            # those branches get, so it is not optional.
            - name: Pytest
              run: pytest -q
